# Market Pulse AI — 每日收盘后自动更新真实数据快照
# 用法：将整个 market-pulse 目录推送到 GitHub 仓库（HTML 放仓库根目录或配置 Pages 目录）
# 触发：周一至周五 UTC 21:00（≈ 美东 16:00/17:00 收盘后），也可手动触发
name: daily-data

on:
  schedule:
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet yfinance pandas numpy

      - name: Fetch & compute snapshot
        run: python fetch_data.py

      - name: Commit snapshot
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshot.js
          git diff --cached --quiet || git commit -m "chore(data): snapshot $(date -u +%Y-%m-%d)"
          git push
